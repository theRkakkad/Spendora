name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets are exposed as env vars so they can be used in step conditions.
      SPENDORA_KEYSTORE_BASE64: ${{ secrets.SPENDORA_KEYSTORE_BASE64 }}
      SPENDORA_KEYSTORE_PASSWORD: ${{ secrets.SPENDORA_KEYSTORE_PASSWORD }}
      SPENDORA_KEY_ALIAS: ${{ secrets.SPENDORA_KEY_ALIAS }}
      SPENDORA_KEY_PASSWORD: ${{ secrets.SPENDORA_KEY_PASSWORD }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        if: ${{ env.SPENDORA_KEYSTORE_BASE64 != '' && env.SPENDORA_KEYSTORE_PASSWORD != '' && env.SPENDORA_KEY_ALIAS != '' && env.SPENDORA_KEY_PASSWORD != '' }}
        run: |
          printf '%s' "$SPENDORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendora-release.jks"
          echo "SPENDORA_KEYSTORE_FILE=$RUNNER_TEMP/spendora-release.jks" >> "$GITHUB_ENV"
          echo "Release signing enabled with the configured keystore."

      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/app-release.apk
            echo "RELEASE_APK=artifacts/app-release.apk" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/app-release-unsigned.apk
            echo "RELEASE_APK=artifacts/app-release-unsigned.apk" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          else
            echo "Release APK was not produced" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spendora-debug-apk
          path: artifacts/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spendora-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: ${{ env.RELEASE_SIGNED == 'true' && 'Release APK is signed with the repository signing secrets.' || 'Release APK is UNSIGNED because signing secrets were not configured for this build.' }}
